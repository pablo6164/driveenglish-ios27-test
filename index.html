<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta id="statusBarMeta" name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta id="themeColorMeta" name="theme-color" content="#12151A">
<title>DriveEnglish — iOS 27 Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151A;
    --surface:#1B2028;
    --surface2:#232A34;
    --line:#2C333F;
    --accent:#F5B700;
    --accent-dim:#8A6A00;
    --route:#4DD0E1;
    --text:#ECEFF4;
    --muted:#8A93A3;
    --good:#6BCB77;
    --bad:#FF6B6B;
  }
  html[data-theme="light"]{
    --bg:#F4F6F8;
    --surface:#FFFFFF;
    --surface2:#E9EDF2;
    --line:#D6DCE4;
    --accent:#D99A00;
    --accent-dim:#A97900;
    --route:#007C91;
    --text:#171A1F;
    --muted:#667085;
    --good:#31934A;
    --bad:#D64545;
  }
  html[data-theme="light"] body{background:#E5E9EE;}
  html[data-theme="light"] .topbar{background:linear-gradient(180deg,#FFFFFF,var(--bg));}
  html[data-theme="light"] .gauge-card{background:radial-gradient(120% 140% at 15% 0%,#FFFFFF,var(--surface));}
  html[data-theme="light"] .face-front{background:linear-gradient(150deg,#FFFFFF,var(--surface));}
  html[data-theme="light"] .face-back{background:linear-gradient(150deg,#F2F7FA,var(--surface2));}
  html[data-theme="light"] .mix-card, html[data-theme="light"] .dlg-passenger .dlg-bubble{background:linear-gradient(120deg,#E8F5F7,var(--surface));}
  html[data-theme="light"] .bottom-nav{background:rgba(255,255,255,.94);}
  html[data-theme="light"] .toast{background:#FFFFFF;box-shadow:0 8px 30px rgba(30,41,59,.18);}
  .theme-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg);
    font-family:'Inter',sans-serif; color:var(--text);
    display:flex; justify-content:center; align-items:stretch;
  }
  .shell{
    width:100%; max-width:430px; min-height:100vh; min-height:100dvh;
    background:var(--bg); display:flex; flex-direction:column;
    position:relative; overflow:hidden;
  }
  .status-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 6px) + 4px) 26px 4px;
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    font-size:15px; font-weight:600; color:var(--text);
    background:var(--bg); position:relative; z-index:20; flex-shrink:0;
  }
  .status-icons{display:flex; align-items:center; gap:6px; color:var(--text);}
  #app{
    width:100%; flex:1; min-height:0;
    background:var(--bg);
    display:flex; flex-direction:column;
    position:relative; overflow:hidden;
  }
  .home-indicator{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    width:134px; height:5px; border-radius:3px;
    background:rgba(236,239,244,.35); z-index:30; pointer-events:none;
  }
  .topbar{
    padding:14px 20px 14px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #161A21, var(--bg));
    position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:var(--accent); color:#14171C;
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;
  }
  .brand-text{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:.2px;}
  .brand-sub{font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace; letter-spacing:.5px;}
  .back-btn{
    background:none; border:none; color:var(--accent);
    padding:6px 10px 6px 2px; margin-left:-6px; border-radius:10px; cursor:pointer;
    display:flex; align-items:center; gap:2px;
    font-family:-apple-system, BlinkMacSystemFont, sans-serif; font-size:16px; font-weight:600;
  }
  .back-btn .chevron{font-size:22px; font-weight:600; line-height:1;}
  .screen{flex:1; overflow-y:auto; padding:18px 20px 128px;}
  .screen::-webkit-scrollbar{display:none;}

  /* ---- HOME ---- */
  .gauge-card{
    background:radial-gradient(120% 140% at 15% 0%, #1E2530, var(--surface));
    border:1px solid var(--line); border-radius:20px; padding:22px;
    display:flex; align-items:center; gap:18px; margin-bottom:22px;
  }
  .gauge-label{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase;}
  .gauge-num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; margin-top:4px;}
  .gauge-sub{font-size:12px; color:var(--muted); margin-top:6px;}
  .section-title{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    text-transform:uppercase; letter-spacing:.8px; color:var(--muted);
    margin:22px 0 12px;
  }
  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .cat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px; cursor:pointer; transition:transform .15s;
  }
  .cat-card:active{transform:scale(.96);}
  .cat-icon{font-size:24px;}
  .cat-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; margin-top:10px; line-height:1.25;}
  .cat-count{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); margin-top:6px;}
  .cat-bar{height:4px; background:var(--line); border-radius:3px; margin-top:10px; overflow:hidden;}
  .cat-bar-fill{height:100%; background:var(--accent);}
  .mix-card{
    margin-top:14px; background:linear-gradient(120deg, #22303A, var(--surface));
    border:1px solid var(--route); border-radius:16px; padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  }
  .mix-card .cat-name{color:var(--route);}

  /* ---- FLASHCARD ---- */
  .lesson-head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .lesson-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  .progress-track{flex:1; height:6px; background:var(--surface2); border-radius:4px; overflow:hidden; margin:0 4px;}
  .progress-fill{height:100%; background:var(--accent);}
  .card-count{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); text-align:right; margin-bottom:10px;}
  .flash-wrap{perspective:1200px; height:290px; margin-bottom:18px; position:relative;}
  .swipe-layer{width:100%; height:100%; touch-action:pan-y; will-change:transform;}
  .swipe-badge{
    position:absolute; top:14px; z-index:6; padding:8px 14px; border-radius:10px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; letter-spacing:.4px;
    opacity:0; pointer-events:none; border:1px solid;
  }
  .badge-left{left:14px; background:rgba(35,42,52,.9); color:var(--muted); border-color:var(--line); transform:rotate(-6deg);}
  .badge-right{right:14px; background:rgba(107,203,119,.15); color:var(--good); border-color:var(--good); transform:rotate(6deg);}
  .flash-card{
    position:relative; width:100%; height:100%; cursor:pointer;
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .flash-card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; border-radius:22px; backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px; text-align:center; border:1px solid var(--line);
  }
  .face-front{background:linear-gradient(150deg,#1E2530,var(--surface));}
  .face-back{background:linear-gradient(150deg,#26313B,var(--surface2)); transform:rotateY(180deg);}
  .en-word{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; line-height:1.25;}
  .phon{
    font-family:'JetBrains Mono',monospace; color:var(--accent); font-size:15px;
    margin-top:14px; padding:6px 12px; border:1px dashed var(--accent-dim); border-radius:8px;
  }
  .pl-word{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; color:var(--route);}
  .tap-hint{font-size:11px; color:var(--muted); margin-top:16px; font-family:'JetBrains Mono',monospace;}
  .audio-btn{
    position:absolute; top:14px; right:14px; width:40px;height:40px; border-radius:12px;
    background:var(--surface2); border:1px solid var(--line); color:var(--accent);
    font-size:17px; display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .action-row{display:flex; gap:12px;}
  .act-btn{
    flex:1; padding:15px; border-radius:14px; border:none; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .act-repeat{background:var(--surface2); color:var(--text); border:1px solid var(--line);}
  .act-know{background:var(--good); color:#0B1A0E;}
  .nav-row{display:flex; justify-content:space-between; margin-top:14px;}
  .nav-btn{background:none; border:none; color:var(--muted); font-size:13px; font-family:'JetBrains Mono',monospace; cursor:pointer;}

  /* ---- QUIZ ---- */
  .quiz-prompt{
    background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px 20px;
    text-align:center; margin-bottom:18px;
  }
  .quiz-tag{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--route); letter-spacing:1px;}
  .quiz-word{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; margin-top:10px;}
  .opt-list{display:flex; flex-direction:column; gap:10px;}
  .opt-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:15px 16px; border-radius:14px; font-size:15px; font-family:'Inter',sans-serif;
    text-align:left; cursor:pointer;
  }
  .opt-btn.correct{background:rgba(107,203,119,.18); border-color:var(--good); color:var(--good);}
  .opt-btn.wrong{background:rgba(255,107,107,.18); border-color:var(--bad); color:var(--bad);}
  .quiz-progress{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); margin-bottom:14px;}
  .result-num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:44px; color:var(--accent); text-align:center; margin:20px 0 6px;}
  .result-sub{text-align:center; color:var(--muted); font-size:13px; margin-bottom:24px;}
  .primary-btn{
    width:100%; padding:16px; border-radius:14px; border:none; background:var(--accent);
    color:#14171C; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; cursor:pointer;
  }

  /* ---- PROGRESS ---- */
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:10px;}
  .stat-top{display:flex; justify-content:space-between; align-items:center;}
  .stat-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;}
  .stat-pct{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent);}

  /* ---- DIALOGUES ---- */
  .dlg-wrap{display:flex; flex-direction:column; gap:14px;}
  .dlg-row{display:flex; flex-direction:column; max-width:86%;}
  .dlg-row.dlg-driver{align-items:flex-start; align-self:flex-start;}
  .dlg-row.dlg-passenger{align-items:flex-end; align-self:flex-end;}
  .dlg-tag{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.6px;
    color:var(--muted); margin-bottom:4px; padding:0 2px;
  }
  .dlg-bubble{
    position:relative; border-radius:16px; padding:14px 44px 14px 16px;
    border:1px solid var(--line);
  }
  .dlg-driver .dlg-bubble{background:var(--surface); border-bottom-left-radius:4px;}
  .dlg-passenger .dlg-bubble{background:linear-gradient(120deg, #22303A, var(--surface)); border-color:var(--route); border-bottom-right-radius:4px;}
  .dlg-en{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; line-height:1.3;}
  .dlg-pl{font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.3;}
  .dlg-audio{
    position:absolute; top:10px; right:10px; width:28px; height:28px; font-size:12px; border-radius:9px;
  }

  /* ---- BOTTOM NAV ---- */
  .bottom-nav{
    position:absolute; bottom:0; left:0; right:0;
    height:calc(58px + env(safe-area-inset-bottom, 18px));
    padding-bottom:env(safe-area-inset-bottom, 18px);
    background:rgba(27,32,40,.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); display:flex;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:var(--muted); background:none; border:none; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .nav-item.active{color:var(--accent);}
  .nav-item .ic{font-size:20px;}
  .nav-item .lb{font-size:10px; font-weight:600;}
  .empty{text-align:center; color:var(--muted); padding:40px 10px; font-size:14px;}

  .daily-card{background:linear-gradient(135deg,#242C36,var(--surface));border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;}
  .daily-row{display:flex;justify-content:space-between;gap:12px;align-items:center;}
  .daily-num{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--accent);}
  .mini-label{font-size:11px;color:var(--muted);margin-top:3px;}
  .secondary-btn{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:700;cursor:pointer;}
  .danger-btn{color:var(--bad);border-color:rgba(255,107,107,.45);}
  .toast{position:absolute;left:20px;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,18px));z-index:50;background:#262E39;border:1px solid var(--line);border-radius:13px;padding:12px 14px;text-align:center;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.35);}
</style>
</head>

/* ================= STORAGE ================= */
const STORAGE_KEY = 'driveEnglish.progress.v2';
async function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('driveEnglish.progress');
    if(!raw) return;
    const parsed = JSON.parse(raw);
    state.known = new Set(Array.isArray(parsed.known) ? parsed.known : []);
    state.reviews = parsed.reviews && typeof parsed.reviews === 'object' ? parsed.reviews : {};
    state.stats = {...state.stats, ...(parsed.stats || {})};
  }catch(e){ console.warn('Nie udało się odczytać postępu:', e); }
}
async function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({known:Array.from(state.known), reviews:state.reviews, stats:state.stats, version:2}));
  }catch(e){ console.error('Nie udało się zapisać postępu:', e); }
}
function wordKey(cat,en){ return cat+'|'+en; }
function localDateKey(d=new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function updateStudyStreak(){
  const today=localDateKey();
  if(state.stats.lastStudyDate===today) return;
  const yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1);
  state.stats.streak = state.stats.lastStudyDate===localDateKey(yesterday) ? (state.stats.streak||0)+1 : 1;
  state.stats.lastStudyDate=today;
}
function reviewWord(w, known){
  const key=wordKey(w.cat,w.en), now=Date.now();
  const r=state.reviews[key] || {box:0, seen:0, correct:0, due:0};
  r.seen++; state.stats.reviewed++; updateStudyStreak();
  if(known){
    r.correct++; state.stats.correct++; r.box=Math.min(5,(r.box||0)+1);
    const intervals=[0,10*60e3,24*60*60e3,3*24*60*60e3,7*24*60*60e3,21*24*60*60e3];
    r.due=now+intervals[r.box]; state.known.add(key);
  }else{ r.box=0; r.due=now+2*60e3; state.known.delete(key); }
  state.reviews[key]=r;
}
function dueScore(w){
  const r=state.reviews[wordKey(w.cat,w.en)];
  return r ? (r.due||0)-Date.now() : -1e15;
}
function prioritizedDeck(words){
  const unseen=shuffle(words.filter(w=>!state.reviews[wordKey(w.cat,w.en)]));
  const due=words.filter(w=>state.reviews[wordKey(w.cat,w.en)] && dueScore(w)<=0).sort((a,b)=>dueScore(a)-dueScore(b));
  const later=shuffle(words.filter(w=>state.reviews[wordKey(w.cat,w.en)] && dueScore(w)>0));
  return [...due,...unseen,...later];
}
function showToast(msg){ state.toast=msg; render(); setTimeout(()=>{state.toast=null; render();},1800); }
function resetProgress(){
  if(!confirm('Czy na pewno wyzerować cały postęp nauki?')) return;
  state.known=new Set(); state.reviews={}; state.stats={reviewed:0,correct:0,streak:0,lastStudyDate:null};
  try{
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem('driveEnglish.progress');
  }catch(e){}
  showToast('Postęp został wyzerowany');
}

/* ================= AUDIO ================= */
let speechVoices = [];
let activeUtterance = null;
let dialogPlaybackToken = 0;
function refreshVoices(){
  if('speechSynthesis' in window) speechVoices = window.speechSynthesis.getVoices() || [];
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function englishVoice(){
  refreshVoices();
  const english=speechVoices.filter(v=>/^en/i.test(v.lang));
  if(!english.length) return null;
  const preferredNames=/samantha|ava|aaron|daniel|serena|jamie|siri|enhanced|premium/i;
  return english.sort((a,b)=>{
    const score=v=>
      (preferredNames.test(v.name) ? 100 : 0) +
      (/^en-US$/i.test(v.lang) ? 30 : 0) +
      (/^en-GB$/i.test(v.lang) ? 20 : 0) +
      (v.localService ? 10 : 0);
    return score(b)-score(a);
  })[0];
}
function speak(text, options={}){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)){
      showToast('Audio nie jest dostępne w tej przeglądarce');
      resolve(false);
      return;
    }
    const synth=window.speechSynthesis;
    refreshVoices();
    const u=new SpeechSynthesisUtterance(String(text));
    activeUtterance=u;
    u.lang='en-GB';
    const voice=englishVoice();
    if(voice){ u.voice=voice; u.lang=voice.lang; }
    u.rate=0.92; u.pitch=0.98; u.volume=1;
    u.onend=()=>{
      if(activeUtterance===u) activeUtterance=null;
      resolve(true);
    };
    u.onerror=(event)=>{
      if(activeUtterance===u) activeUtterance=null;
      const reason=event.error || '';
      if(reason!=='canceled' && reason!=='interrupted'){
        showToast('Nie udało się odtworzyć głosu');
      }
      resolve(false);
    };

    const replaceCurrent = options.cancel!==false && (synth.speaking || synth.pending);
    if(replaceCurrent) synth.cancel();

    const startSpeaking=()=>{
      synth.resume();
      synth.speak(u);
      setTimeout(()=>{ if(synth.paused) synth.resume(); },120);
    };

    // iPhone wymaga startu bezpośrednio po dotknięciu. Na Macu silnik
    // potrzebuje natomiast krótkiej przerwy tylko wtedy, gdy przed chwilą
    // anulowano inną wypowiedź.
    const isiPhone=/iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(replaceCurrent && !isiPhone) setTimeout(startSpeaking,60);
    else startSpeaking();
  });
}
function stopSpeech(){
  dialogPlaybackToken++;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}

const THEME_KEY='driveEnglish.theme';
function preferredTheme(){
  try{
    const saved=localStorage.getItem(THEME_KEY);
    if(saved==='light'||saved==='dark') return saved;
  }catch(e){}
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  const meta=document.getElementById('themeColorMeta');
  const status=document.getElementById('statusBarMeta');
  if(meta) meta.content=theme==='light'?'#F4F6F8':'#12151A';
  if(status) status.content=theme==='light'?'default':'black-translucent';
}
function toggleTheme(){
  const next=document.documentElement.dataset.theme==='light'?'dark':'light';
  applyTheme(next);
  try{localStorage.setItem(THEME_KEY,next);}catch(e){}
  render();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function catKnownCount(catKey){

}

}

let lastSpokenKey = null;
function autoSpeakCurrentCard(){
  const w = state.deck[state.idx];
  if(!w) return;
  const key = state.cat + '|' + w.en + '|' + state.idx + '|' + state.deck.length;
  if(key !== lastSpokenKey){
    lastSpokenKey = key;
    speak(w.en);
  }
}

function topbarTitle(){
  if(state.view==='lesson') return state.cat ? DATA[state.cat].label : 'Mix wszystkich';
  if(state.view==='quizSetup') return 'Quiz';
  if(state.view==='quiz') return 'Quiz';
  if(state.view==='quizResult') return 'Wynik';
  if(state.view==='progress') return 'Postępy';
  if(state.view==='dialogSetup') return 'Dialogi';
  if(state.view==='dialog') return state.dialogKey ? DIALOGUES[state.dialogKey].label : 'Dialog';
  return '';
}

/* ---- HOME ---- */
function renderHome(){
  const known = totalKnownCount();
  const pct = Math.round((known/TOTAL_WORDS)*100);
  let cards = CAT_KEYS.map(k=>{
    const cat = DATA[k];
    const kc = catKnownCount(k);
    const p = Math.round((kc/cat.words.length)*100);
    return `
      <div class="cat-card" onclick="openCategory('${k}')">
        <div class="cat-icon">${cat.icon}</div>
        <div class="cat-name">${cat.label}</div>
        <div class="cat-count">${kc}/${cat.words.length} poznanych</div>
        <div class="cat-bar"><div class="cat-bar-fill" style="width:${p}%"></div></div>
      </div>`;
  }).join('');

  const accuracy = state.stats.reviewed ? Math.round((state.stats.correct/state.stats.reviewed)*100) : 0;
  return `
    <div class="daily-card"><div class="daily-row">
      <div><div class="daily-num">${state.stats.streak || 0} dni</div><div class="mini-label">seria nauki</div></div>
      <div><div class="daily-num">${state.stats.reviewed || 0}</div><div class="mini-label">powtórek</div></div>
      <div><div class="daily-num">${accuracy}%</div><div class="mini-label">trafności</div></div>
    </div></div>
    <div class="gauge-card">
      ${gaugeSvg(pct)}
      <div>
        <div class="gauge-label">Postęp ogólny</div>
        <div class="gauge-num">${known} / ${TOTAL_WORDS}</div>
        <div class="gauge-sub">słów i zwrotów poznanych</div>
      </div>
    </div>
    <div class="mix-card" onclick="startMix()">
      <div>
        <div class="cat-name">🔀 Mix wszystkich kategorii</div>
        <div class="cat-count">Losowe fiszki ze wszystkich ${TOTAL_WORDS} pozycji</div>
      </div>
      <div style="font-size:20px;">→</div>
    </div>
    <div class="section-title">Kategorie</div>
    <div class="cat-grid">${cards}</div>
  `;
}

function gaugeSvg(pct){
  const r=34, c=2*Math.PI*r;
  const off = c - (pct/100)*c;
  return `
  <svg width="86" height="86" viewBox="0 0 86 86">
    <circle cx="43" cy="43" r="${r}" stroke="var(--line)" stroke-width="9" fill="none"/>
    <circle cx="43" cy="43" r="${r}" stroke="var(--accent)" stroke-width="9" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 43 43)"/>
    <text x="43" y="49" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="18" fill="var(--text)">${pct}%</text>
  </svg>`;
}

function openCategory(k){
  stopSpeech();
  state.cat = k;
  state.deck = prioritizedDeck(DATA[k].words.map(w=>({...wordObj(w), cat:k})));
  state.idx = 0; state.flipped = false;
  lastSpokenKey = null;
  state.view = 'lesson';
  render();
}
function startMix(){
  stopSpeech();
  let all = [];
  CAT_KEYS.forEach(k=> DATA[k].words.forEach(w=> all.push({...wordObj(w), cat:k})));
  state.cat = null;
  state.deck = prioritizedDeck(all);
  state.idx = 0; state.flipped = false;
  lastSpokenKey = null;
  state.view = 'lesson';
  render();
}
function continueLearning(){
  stopSpeech();
  if(state.deck.length && state.idx < state.deck.length-1){
    state.idx++;
    state.flipped=false;
    state.view='lesson';
    render();
  }else{
    startMix();
  }
}
function wordObj(w){ return {en:w[0], pl:w[1], phon:w[2]}; }
function goHome(){ stopSpeech(); state.view='home'; render(); }

/* ---- LESSON / FLASHCARDS ---- */
function renderLesson(){
  if(state.deck.length===0) return `<div class="empty">Brak słówek w tej kategorii.</div>`;
  const w = state.deck[state.idx];
  const pct = Math.round(((state.idx+1)/state.deck.length)*100);
  const isKnown = state.known.has(wordKey(w.cat, w.en));
  return `
    <div class="card-count">${state.idx+1} / ${state.deck.length}</div>
    <div class="progress-track" style="margin-bottom:16px;"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="flash-wrap">
      <div class="swipe-badge badge-left" id="badgeRepeat">↻ POWTÓRZ</div>
      <div class="swipe-badge badge-right" id="badgeKnow">✓ ZNAM</div>
      <div class="swipe-layer" id="swipeLayer">
        <div class="flash-card ${state.flipped?'flipped':''}" onclick="flipCard()">
          <div class="face face-front">
            <button class="audio-btn" onclick="event.stopPropagation(); speak('${escJs(w.en)}')">🔊</button>
            <div class="en-word">${w.en}</div>
            <div class="phon">/ ${w.phon} /</div>
            <div class="tap-hint">${isKnown?'✓ ZNASZ TO SŁOWO':'DOTKNIJ, ABY ZOBACZYĆ TŁUMACZENIE'}</div>
          </div>
          <div class="face face-back">
            <div class="pl-word">${w.pl}</div>
            <div class="tap-hint" style="margin-top:18px;">${w.en}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="action-row">
      <button class="act-btn act-repeat" onclick="markCard(false)">↻ Powtórz</button>
      <button class="act-btn act-know" onclick="markCard(true)">✓ Znam</button>
    </div>
    <div class="nav-row">
      <button class="nav-btn" onclick="prevCard()">‹ Poprzednia</button>
      <button class="nav-btn" onclick="nextCard()">Następna ›</button>
    </div>
    <div class="tap-hint" style="text-align:center; margin-top:10px;">PRZESUŃ W PRAWO = ZNAM · W LEWO = POWTÓRZ</div>
  `;
}
function escJs(s){ return s.replace(/'/g, "\\'"); }
let suppressFlip = false;
function flipCard(){
  if(suppressFlip) return;
  const showingTranslation = !state.flipped;
  state.flipped = !state.flipped; render();
  if(showingTranslation){
    const w=state.deck[state.idx];
    if(w) speak(w.en);
  }
}
function markCard(known){
  const w = state.deck[state.idx];
  const key = wordKey(w.cat, w.en);
  reviewWord(w, known);
  saveProgress();
  nextCard();
}
function nextCard(){
  stopSpeech();
  if(state.idx < state.deck.length-1){ state.idx++; state.flipped=false; render(); }
  else { goHome(); }
}
function prevCard(){
  stopSpeech();
  if(state.idx>0){ state.idx--; state.flipped=false; render(); }
}

/* ---- SWIPE GESTURES ---- */
function setupSwipe(){
  const layer = document.getElementById('swipeLayer');
  if(!layer) return;
  const know = document.getElementById('badgeKnow');
  const repeat = document.getElementById('badgeRepeat');
  let startX=0, startY=0, dx=0, dragging=false, horizontal=false, moved=false;

  function onDown(e){
    dragging = true; horizontal = false; moved = false; dx = 0;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    layer.style.transition = 'none';
    if(e.pointerId!==undefined){ try{ layer.setPointerCapture(e.pointerId); }catch(err){} }
  }
  function onMoveFn(e){
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const diffX = p.clientX - startX;
    const diffY = p.clientY - startY;
    if(!horizontal && !moved){
      if(Math.abs(diffX) > 8 || Math.abs(diffY) > 8){
        horizontal = Math.abs(diffX) > Math.abs(diffY);
        moved = true;
      }
    }
    if(horizontal){
      if(e.cancelable) e.preventDefault();
      dx = diffX;
      layer.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
      const t = Math.min(Math.abs(dx)/100, 1);
      if(dx > 0){ know.style.opacity = t; repeat.style.opacity = 0; }
      else { repeat.style.opacity = t; know.style.opacity = 0; }
    }
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    layer.style.transition = 'transform .3s ease';
    if(horizontal && Math.abs(dx) > 90){
      const goRight = dx > 0;
      layer.style.transform = `translateX(${goRight ? 700 : -700}px) rotate(${goRight ? 28 : -28}deg)`;
      suppressFlip = true;
      setTimeout(()=>{ markCard(goRight); suppressFlip = false; }, 180);
    } else {
      layer.style.transform = 'translateX(0) rotate(0)';
      know.style.opacity = 0; repeat.style.opacity = 0;
      if(horizontal){
        suppressFlip = true;
        setTimeout(()=>{ suppressFlip = false; }, 80);
      }
    }
    horizontal = false; dx = 0;
  }

  if(window.PointerEvent){
    layer.addEventListener('pointerdown', onDown);
    layer.addEventListener('pointermove', onMoveFn);
    layer.addEventListener('pointerup', onUp);
    layer.addEventListener('pointercancel', onUp);
  }else{
    layer.addEventListener('touchstart', onDown, {passive:true});
    layer.addEventListener('touchmove', onMoveFn, {passive:false});
    layer.addEventListener('touchend', onUp);
  }
}

/* ---- QUIZ ---- */
function goQuizSetup(){ stopSpeech(); state.view='quizSetup'; render(); }
function renderQuizSetup(){
  let opts = CAT_KEYS.map(k=>`<button class="opt-btn" onclick="startQuiz('${k}')">${DATA[k].icon} ${DATA[k].label} (${DATA[k].words.length})</button>`).join('');
  return `
    <div class="quiz-prompt">
      <div class="quiz-tag">TRYB QUIZU</div>
      <div class="quiz-word" style="font-size:16px;">10 pytań, wybierz kategorię lub zagraj z mixu</div>
    </div>
    <button class="primary-btn" style="margin-bottom:14px;" onclick="startQuiz(null)">🔀 Mix wszystkich kategorii</button>
    <div class="section-title" style="margin-top:6px;">Albo wybierz kategorię</div>
    <div class="opt-list">${opts}</div>
  `;
}
function startQuiz(catKey){
  let pool = catKey ? DATA[catKey].words.map(w=>({...wordObj(w)})) : CAT_KEYS.flatMap(k=>DATA[k].words.map(w=>wordObj(w)));
  pool = shuffle(pool).slice(0, Math.min(10, pool.length));
  const allWords = catKey ? DATA[catKey].words.map(w=>wordObj(w)) : CAT_KEYS.flatMap(k=>DATA[k].words.map(w=>wordObj(w)));
  const questions = pool.map(w=>{
    const direction = Math.random()<0.5 ? 'en2pl' : 'pl2en';
    const correct = direction==='en2pl' ? w.pl : w.en;
    let distractors = shuffle(allWords.filter(x=>x.en!==w.en)).slice(0,3).map(x=> direction==='en2pl'?x.pl:x.en);
    const options = shuffle([correct, ...distractors]);
    return {word:w, direction, correct, options};
  });
  state.quiz = {questions, idx:0, score:0, answered:false, picked:null};
  state.view='quiz';
  render();
}
function renderQuiz(){
  const q = state.quiz.questions[state.quiz.idx];
  const prompt = q.direction==='en2pl' ? q.word.en : q.word.pl;
  const tag = q.direction==='en2pl' ? 'PRZETŁUMACZ NA POLSKI' : 'TRANSLATE TO ENGLISH';
  let opts = q.options.map(o=>{
    let cls='opt-btn';
    if(state.quiz.answered){
      if(o===q.correct) cls+=' correct';
      else if(o===state.quiz.picked) cls+=' wrong';
    }
    return `<button class="${cls}" onclick="answerQuiz('${escJs(o)}')">${o}</button>`;
  }).join('');
  return `
    <div class="quiz-progress">Pytanie ${state.quiz.idx+1} / ${state.quiz.questions.length} · Wynik: ${state.quiz.score}</div>
    <div class="quiz-prompt">
      <div class="quiz-tag">${tag}</div>
      <div class="quiz-word">${prompt}</div>
      ${q.direction==='en2pl' ? `<button class="audio-btn" style="position:static; margin-top:14px;" onclick="speak('${escJs(q.word.en)}')">🔊</button>` : ''}
    </div>
    <div class="opt-list">${opts}</div>
    ${state.quiz.answered ? `<button class="primary-btn" style="margin-top:16px;" onclick="nextQuizQ()">Dalej →</button>` : ''}
  `;
}
function answerQuiz(opt){
  if(state.quiz.answered) return;
  state.quiz.answered = true;
  state.quiz.picked = opt;
  if(opt===state.quiz.questions[state.quiz.idx].correct) state.quiz.score++;
  render();
}
function nextQuizQ(){
  if(state.quiz.idx < state.quiz.questions.length-1){
    state.quiz.idx++; state.quiz.answered=false; state.quiz.picked=null;
    render();
  } else {
    state.view='quizResult'; render();
  }
}
function renderQuizResult(){
  const total = state.quiz.questions.length;
  const score = state.quiz.score;
  const pct = Math.round((score/total)*100);
  let msg = pct>=80 ? 'Świetna jazda! 🚕' : pct>=50 ? 'Dobra robota, jedź dalej!' : 'Ćwicz dalej, będzie lepiej!';
  return `
    <div class="quiz-prompt">
      <div class="quiz-tag">WYNIK QUIZU</div>
      <div class="result-num">${score}/${total}</div>
      <div class="result-sub">${msg}</div>
      <button class="primary-btn" onclick="goQuizSetup()">Zagraj ponownie</button>
    </div>
  `;
}

/* ---- PROGRESS ---- */
function goProgress(){ stopSpeech(); state.view='progress'; render(); }
function renderProgress(){
  const known = totalKnownCount();
  const pct = Math.round((known/TOTAL_WORDS)*100);
  let rows = CAT_KEYS.map(k=>{
    const cat = DATA[k];
    const kc = catKnownCount(k);
    const p = Math.round((kc/cat.words.length)*100);
    return `
      <div class="stat-card">
        <div class="stat-top">
          <div class="stat-name">${cat.icon} ${cat.label}</div>
          <div class="stat-pct">${p}%</div>
        </div>
        <div class="cat-bar" style="margin-top:10px;"><div class="cat-bar-fill" style="width:${p}%"></div></div>
        <div class="cat-count" style="margin-top:8px;">${kc} / ${cat.words.length} poznanych</div>
      </div>`;
  }).join('');
  return `
    <div class="gauge-card">
      ${gaugeSvg(pct)}
      <div>
        <div class="gauge-label">Łącznie</div>
        <div class="gauge-num">${known} / ${TOTAL_WORDS}</div>
        <div class="gauge-sub">${pct}% ukończone</div>
      </div>
    </div>
    <div class="section-title">Postępy w kategoriach</div>
    ${rows}
    <div class="section-title">Dane</div>
    <button class="secondary-btn danger-btn" onclick="resetProgress()">Wyzeruj postęp</button>
  `;
}

/* ---- DIALOGUES ---- */
const DLG_KEYS = Object.keys(DIALOGUES);
function goDialogSetup(){ stopSpeech(); state.view='dialogSetup'; render(); }
function renderDialogSetup(){
  let cards = DLG_KEYS.map(k=>{
    const d = DIALOGUES[k];
    return `
      <div class="cat-card" style="grid-column:span 2; display:flex; align-items:center; justify-content:space-between; padding:16px 18px;" onclick="openDialog('${k}')">
        <div>
          <div class="cat-name" style="margin-top:0;">${d.icon} ${d.label}</div>
          <div class="cat-count">${d.lines.length} kwestii · kierowca ↔ pasażer</div>
        </div>
        <div style="font-size:20px;">→</div>
      </div>`;
  }).join('');
  return `
    <div class="quiz-prompt">
      <div class="quiz-tag">DIALOGI</div>
      <div class="quiz-word" style="font-size:16px;">Przykładowe rozmowy kierowca–pasażer</div>
    </div>
    <div class="section-title" style="margin-top:6px;">Wybierz scenariusz</div>
    <div class="cat-grid" style="grid-template-columns:1fr;">${cards}</div>
  `;
}
function openDialog(k){
  stopSpeech();
  state.dialogKey = k;
  state.view = 'dialog';
  render();
}
function renderDialog(){
  const d = DIALOGUES[state.dialogKey];
  let rows = d.lines.map(l=>`
    <div class="dlg-row dlg-${l.who}">
      <div class="dlg-tag">${l.who==='driver' ? '🚗 KIEROWCA' : '🧍 PASAŻER'}</div>
      <div class="dlg-bubble">
        <div class="dlg-en">${l.en}</div>
        <div class="dlg-pl">${l.pl}</div>
        <button class="audio-btn dlg-audio" onclick="speak('${escJs(l.en)}')">🔊</button>
      </div>
    </div>
  `).join('');
  return `
    <div class="quiz-prompt" style="margin-bottom:18px; text-align:left;">
      <div class="quiz-tag">${d.icon} ${d.label.toUpperCase()}</div>
      <div class="quiz-word" style="font-size:15px; margin-top:8px;">Dotknij 🔊 przy każdej kwestii albo odtwórz cały dialog</div>
      <button class="primary-btn" style="margin-top:14px;" onclick="playDialog()">▶️ Odtwórz cały dialog</button>
    </div>
    <div class="dlg-wrap">${rows}</div>
  `;
}
async function playDialog(){
  const d=DIALOGUES[state.dialogKey];
  if(!d) return;
  const token=++dialogPlaybackToken;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  for(const line of d.lines){
    if(token!==dialogPlaybackToken) return;
    const ok=await speak(line.en,{cancel:false});
    if(!ok || token!==dialogPlaybackToken) return;
    await new Promise(r=>setTimeout(r,220));
  }
}

/* ================= STATUS BAR CLOCK ================= */
function updateStatusClock(){
  const el = document.getElementById('statusClock');
  if(!el) return;
  const now = new Date();
  el.textContent = now.toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'});
}
updateStatusClock();
setInterval(updateStatusClock, 15000);

/* ================= INIT ================= */
(async function init(){
  await loadProgress();
  render();
})();
</script>
